  <text x="600" y="468" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="10" fill="#D4AF37" text-anchor="middle">NIGERIAN FASHION MARKETPLACE</text>
  <text x="600" y="520" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="4" fill="#9CA3AF" text-anchor="middle">AUTHENTIC NIGERIAN CRAFTSMANSHIP • GLOBAL STYLE</text>
</svg>
