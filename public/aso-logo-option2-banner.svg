  <rect width="1200" height="630" fill="#111827"/>
  
  <!-- Subtle Elegant Radial Gradient Accent -->
  <circle cx="600" cy="315" r="450" fill="#C59B27" fill-opacity="0.06"/>
  <line x1="200" y1="460" x2="1000" y2="460" stroke="#C59B27" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Centered Emblem -->
  <g transform="translate(420, 160) scale(2.5)">
    <!-- Silver Needle -->
    <path d="M20 70 L60 15" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="56" cy="19" r="2.5" fill="#111827"/>
