<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Matte Obsidian Background -->
  <rect width="800" height="800" rx="160" fill="#111827"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="400" cy="380" r="280" fill="#C59B27" fill-opacity="0.08"/>

  <!-- Centered Emblem -->
  <g transform="translate(260, 200) scale(2.8)">
    <!-- Silver Needle -->
    <path d="M20 70 L60 15" stroke="#F9FAFB" stroke-width="5" stroke-linecap="round"/>
    <circle cx="56" cy="19" r="2.5" fill="#111827"/>
    <!-- Gold Thread Interlock -->
    <path d="M6 48 C 24 14, 60 20, 50 48 C 40 70, 74 70, 78 40" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Centered Wordmark -->
  <text x="400" y="580" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="96" font-weight="900" letter-spacing="14" fill="#FFFFFF" text-anchor="middle">ASO</text>
  <text x="400" y="635" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="700" letter-spacing="8" fill="#D4AF37" text-anchor="middle">MARKETPLACE</text>
</svg>
