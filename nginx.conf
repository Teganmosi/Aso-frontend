server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression. Requests arrive through Caddy, and nginx's default
    # (gzip_proxied off) skipped compressing those, so the 260 KB app bundle went
    # out uncompressed (~75 KB gzipped). Matters a lot on Nigerian mobile data.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript
               text/xml application/xml application/xml+rss image/svg+xml application/manifest+json;

    # React Router SPA routing fallback. index.html must never be cached long,
    # or visitors keep loading old bundles after a deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite build output: filenames contain a content hash, safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker must be re-checked on every visit so updates roll out.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Files in public/ keep their names when replaced (e.g. hero-bg.png), so
    # cache them for a week rather than forever.
    location ~* \.(png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf|eot|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Health check endpoint
    location /healthz {
        return 200 "healthy\n";
    }
}
